# Napomena: `network_mode: host` za sve servise koji trebaju Postgres na 127.0.0.1 hosta
# i interni OCR — izbjegava bridge + host.docker.internal + pg_hba prilagodbe.
# Django → OCR: http://127.0.0.1:8866 (uvicorn na host mreži).

services:
  django:
    image: python:3.12-slim
    container_name: uzorita-django
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    volumes:
      - ./app:/app
    network_mode: host
    depends_on:
      paddle-ocr-fastapi:
        condition: service_healthy

  booking-worker:
    image: python:3.12-slim
    container_name: uzorita-booking-worker
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python manage.py migrate &&
      python manage.py run_booking_pipeline --interval 60 --mark-seen"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    volumes:
      - ./app:/app
    network_mode: host
    restart: unless-stopped

  paddle-ocr-fastapi:
    build:
      context: ../ocr_service
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    # Nakon train+export: /opt/stacks/PaddleOCR/output/hr_id_rec_infer mora postojati
    environment:
      PADDLEOCR_REC_MODEL_DIR: /models/hr_id_rec_infer
      PADDLEOCR_CPU_THREADS: "16"
    volumes:
      - /opt/stacks/PaddleOCR/output/hr_id_rec_infer:/models/hr_id_rec_infer:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8866/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
