# Django, Celery, and OCR on hetzner_net (postgis, infra-redis).
# Django also on proxy for Traefik (rooms.uzorita.hr API/admin).

x-uzorita-backend-env: &uzorita-backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: "*"
  DB_ENGINE: django.db.backends.postgresql
  DB_HOST: postgis
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://infra-redis:6379/1
  CELERY_RESULT_BACKEND: redis://infra-redis:6379/1
  PADDLE_OCR_BASE_URL: http://paddle-ocr-fastapi:8866
  TAILSCALE_EXIT_NODE: ${TAILSCALE_EXIT_NODE:-}
  BOOKING_EXTRANET_TAILSCALE_EXIT_NODE: ${BOOKING_EXTRANET_TAILSCALE_EXIT_NODE:-${TAILSCALE_EXIT_NODE:-}}

x-uzorita-backend-volumes: &uzorita-backend-volumes
  - ./app:/app
  - booking_browser_data:/data/booking_browser

services:
  django:
    image: python:3.12-slim
    container_name: uzorita-django
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      <<: *uzorita-backend-env
    volumes: *uzorita-backend-volumes
    networks:
      - hetzner_net
      - proxy
    depends_on:
      paddle-ocr-fastapi:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.rooms-backend.rule=Host(`rooms.uzorita.hr`) && (PathPrefix(`/admin`) || PathPrefix(`/reception`) || PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/static`) || PathPrefix(`/favicon.ico`) || PathPrefix(`/logo.png`))
      - traefik.http.routers.rooms-backend.entrypoints=websecure
      - traefik.http.routers.rooms-backend.tls=true
      - traefik.http.routers.rooms-backend.tls.certresolver=le
      - traefik.http.routers.rooms-backend.priority=200
      - traefik.http.services.rooms-backend.loadbalancer.server.port=8000

  celery-worker:
    image: python:3.12-slim
    container_name: uzorita-celery-worker
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python manage.py migrate &&
      celery -A config worker -l info --concurrency=2 -Q celery"
    env_file:
      - .env
    environment:
      <<: *uzorita-backend-env
    volumes: *uzorita-backend-volumes
    networks:
      - hetzner_net
    restart: unless-stopped

  celery-beat:
    image: python:3.12-slim
    container_name: uzorita-celery-beat
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python manage.py migrate &&
      celery -A config beat -l info"
    env_file:
      - .env
    environment:
      <<: *uzorita-backend-env
    volumes: *uzorita-backend-volumes
    networks:
      - hetzner_net
    restart: unless-stopped

  # Tailscale sidecar: shared network namespace with celery-booking-browser.
  # Set TAILSCALE_EXIT_NODE to laptop hostname (must advertise exit node in Headscale).
  tailscale-booking-browser:
    image: tailscale/tailscale:latest
    container_name: tailscale-booking-browser
    hostname: tailscale-booking-browser
    env_file:
      - .env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTHKEY: ${TS_AUTHKEY_BOOKING_BROWSER:-}
      TS_EXTRA_ARGS: >-
        --login-server=${TS_LOGIN_SERVER:-https://hs-control.qubitsecured.online}
        --hostname=${TS_HOSTNAME_BOOKING_BROWSER:-tailscale-booking-browser}
        --accept-dns=false
        --accept-routes=true
        --exit-node=${TAILSCALE_EXIT_NODE:-}
        --exit-node-allow-lan-access=true
      TAILSCALE_EXIT_NODE: ${TAILSCALE_EXIT_NODE:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_booking_state:/var/lib/tailscale
      - ./scripts/tailscale-booking-healthcheck.sh:/usr/local/bin/tailscale-booking-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/tailscale-booking-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - hetzner_net
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.rooms-booking-vnc.rule=Host(`rooms.uzorita.hr`) && PathPrefix(`/booking-vnc`)
      - traefik.http.routers.rooms-booking-vnc.entrypoints=websecure
      - traefik.http.routers.rooms-booking-vnc.tls=true
      - traefik.http.routers.rooms-booking-vnc.tls.certresolver=le
      - traefik.http.routers.rooms-booking-vnc.priority=150
      - traefik.http.routers.rooms-booking-vnc.middlewares=rooms-booking-vnc-stripprefix,rooms-booking-vnc-headers
      - traefik.http.routers.rooms-booking-vnc-ws.rule=Host(`rooms.uzorita.hr`) && PathPrefix(`/booking-vnc/websockify`)
      - traefik.http.routers.rooms-booking-vnc-ws.entrypoints=websecure
      - traefik.http.routers.rooms-booking-vnc-ws.tls=true
      - traefik.http.routers.rooms-booking-vnc-ws.tls.certresolver=le
      - traefik.http.routers.rooms-booking-vnc-ws.priority=160
      - traefik.http.routers.rooms-booking-vnc-ws.middlewares=rooms-booking-vnc-auth,rooms-booking-vnc-stripprefix,rooms-booking-vnc-headers
      - traefik.http.routers.rooms-booking-vnc-ws.service=rooms-booking-vnc
      - traefik.http.middlewares.rooms-booking-vnc-auth.forwardauth.address=http://uzorita-django:8000/api/reception/booking-extranet/vnc/auth/
      - traefik.http.middlewares.rooms-booking-vnc-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.rooms-booking-vnc-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN
      - traefik.http.middlewares.rooms-booking-vnc-stripprefix.stripprefix.prefixes=/booking-vnc
      - traefik.http.services.rooms-booking-vnc.loadbalancer.server.port=6080
    restart: unless-stopped

  celery-booking-browser:
    build:
      context: .
      dockerfile: Dockerfile.booking-browser
    image: uzorita-celery-booking-browser:local
    container_name: uzorita-celery-booking-browser
    working_dir: /app
    network_mode: service:tailscale-booking-browser
    depends_on:
      tailscale-booking-browser:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *uzorita-backend-env
      DISPLAY: ":99"
      BOOKING_EXTRANET_VNC_DISPLAY: ":99"
      TAILSCALE_EXIT_NODE: ${TAILSCALE_EXIT_NODE:-}
    volumes:
      - ./app:/app
      - booking_browser_data:/data/booking_browser
    restart: unless-stopped

  paddle-ocr-fastapi:
    build:
      context: ../ocr_service
    container_name: paddle-ocr-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PADDLEOCR_REC_MODEL_DIR: /models/hr_id_rec_infer
      PADDLEOCR_CPU_THREADS: "16"
    volumes:
      - /opt/stacks/PaddleOCR/output/hr_id_rec_infer:/models/hr_id_rec_infer:ro
    networks:
      - hetzner_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8866/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  booking_browser_data:
  tailscale_booking_state:

networks:
  hetzner_net:
    external: true
  proxy:
    external: true
